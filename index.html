<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#122A1C">
<title>Stadio — Terrains de soccer à Montréal</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F4EF; --panel:#FFFFFF; --line:#DDE1D6;
    --ink:#16241A; --ink-dim:#6B7568;
    --accent-dark:#122A1C; --accent-dark-2:#1C3C28;
    --on-accent:#F1F3EC; --on-accent-dim:#9FB0A2;
    --floodlight:#2E7D4F;
    --libre:#2F9E5C;
    --occupe:#D9483A; --ferme:#6B7280;
    --radius:10px; --shadow:0 8px 22px rgba(15,30,20,.14);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;overflow:hidden;-webkit-text-size-adjust:100%;}
  ::selection{background:var(--floodlight);color:#fff;}
  button,input,select{font-family:inherit;}
  button{-webkit-tap-highlight-color:transparent;}

  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  /* ---------- Statuts (une seule définition de couleur par statut) ---------- */
  .s-libre{--c:var(--libre);}
  .s-occupe{--c:var(--occupe);} .s-ferme{--c:var(--ferme);}
  .status-dot,.sb-dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0;display:inline-block;}

  /* ---------- Bandeau ---------- */
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;background:linear-gradient(180deg,var(--accent-dark-2),var(--accent-dark));
    flex-shrink:0;z-index:20;
  }
  .wordmark{display:flex;align-items:baseline;gap:10px;}
  .wordmark .dot{width:10px;height:10px;border-radius:50%;background:var(--libre);box-shadow:0 0 0 3px rgba(47,158,92,.30);flex-shrink:0;align-self:center;}
  .wordmark h1{font-family:'Teko',sans-serif;font-weight:600;font-size:32px;letter-spacing:.5px;margin:0;color:var(--on-accent);line-height:1;text-transform:uppercase;}
  .wordmark span.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--on-accent-dim);letter-spacing:.04em;}
  .top-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--on-accent-dim);text-align:right;}
  .top-meta b{color:#fff;font-weight:500;}

  #loadError{display:none;background:var(--occupe);color:#fff;font-size:12.5px;padding:8px 22px;font-family:'IBM Plex Mono',monospace;}

  /* ---------- Barre d'outils : sport + filtres ---------- */
  .toolbar{display:flex;gap:10px;padding:10px 22px;background:var(--bg);border-bottom:1px solid var(--line);align-items:center;flex-shrink:0;}
  .sport-chips{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;}
  .chip{
    font-weight:600;font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-dim);cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  .chip:hover{border-color:var(--floodlight);}
  .chip.active{background:var(--floodlight);color:#fff;border-color:var(--floodlight);}
  .chip.disabled{opacity:.4;cursor:not-allowed;}
  .mobile-sport-select{display:none;}
  .filter-open-btn{
    display:flex;align-items:center;gap:8px;flex-shrink:0;
    padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;
  }
  .filter-open-btn:hover{border-color:var(--floodlight);}
  .filter-open-btn svg{width:16px;height:16px;}
  .filter-badge{background:var(--floodlight);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;}
  .mobile-tabs{display:none;}

  /* ---------- Corps ---------- */
  main.split{flex:1;display:flex;min-height:0;position:relative;}
  .map-wrap{flex:1;min-width:0;position:relative;background:#E7EAE1;}
  #map{position:absolute;inset:0;}
  aside.list{
    width:400px;flex-shrink:0;border-left:1px solid var(--line);
    background:var(--panel);display:flex;flex-direction:column;min-height:0;
  }
  .list-head{padding:14px 18px;background:var(--accent-dark);flex-shrink:0;}
  .list-head h2{font-family:'Teko',sans-serif;font-weight:600;font-size:20px;margin:0 0 2px;text-transform:uppercase;letter-spacing:.03em;color:var(--on-accent);}
  .list-head p{margin:0;font-size:12px;color:var(--on-accent-dim);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .link-btn{background:none;border:none;padding:0;color:#8fd3a8;font-weight:600;font-size:12px;cursor:pointer;text-decoration:underline;}
  .list-body{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .empty-state{padding:28px 14px;text-align:center;color:var(--ink-dim);font-size:13px;line-height:1.5;}
  .empty-state .btn{margin:12px auto 0;max-width:220px;display:block;}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s ease, box-shadow .15s ease;
    box-shadow:0 1px 2px rgba(20,40,25,.05);
  }
  .card:hover,.card:focus-visible{border-color:var(--floodlight);box-shadow:var(--shadow);outline:none;}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .card-name{font-weight:600;font-size:14.5px;color:var(--ink);}
  .status-pill{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.03em;
    padding:3px 8px;border-radius:5px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;
    display:flex;align-items:center;gap:5px;color:var(--c);
    background:color-mix(in srgb,var(--c) 13%,transparent);
  }
  .s-ferme.status-pill{color:#4b5563;}
  .card-meta{font-size:12px;color:var(--ink-dim);display:flex;justify-content:space-between;gap:8px;}

  /* ---------- Fiche ---------- */
  .detail{padding:0 14px 14px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .detail-bar{position:sticky;top:0;z-index:2;background:var(--panel);padding:12px 0 8px;}
  .back-btn{
    background:none;border:none;color:var(--ink-dim);font-size:13px;font-weight:600;cursor:pointer;
    padding:6px 0;display:flex;align-items:center;gap:4px;
  }
  .back-btn:hover{color:var(--floodlight);}
  .detail-img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:var(--radius);margin-bottom:10px;background:var(--bg);display:block;}
  .detail-name{font-family:'Teko',sans-serif;font-size:24px;font-weight:600;text-transform:uppercase;line-height:1.05;margin-bottom:6px;}
  .detail-status{
    display:flex;align-items:flex-start;gap:8px;font-size:14px;font-weight:600;
    padding:8px 11px;border-radius:8px;margin-bottom:10px;line-height:1.3;
    background:color-mix(in srgb,var(--c) 12%,transparent);
  }
  .detail-status .status-dot{width:10px;height:10px;margin-top:4px;}
  .detail-status small{display:block;font-weight:500;font-size:12px;color:var(--ink-dim);margin-top:1px;}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .tag{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink-dim);white-space:nowrap;}
  .tag.lieu{background:var(--accent-dark);border-color:var(--accent-dark);color:var(--on-accent);}

  .timeline{margin:10px 0;padding-left:10px;border-left:3px solid var(--line);}
  .timeline h3,.section h3{font-family:'Teko',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 6px;color:var(--ink);}
  .timeline-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px;color:var(--ink);}
  .timeline-row .hrs{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);min-width:78px;flex-shrink:0;}
  .timeline-row.now{font-weight:600;}
  .timeline-empty{font-size:12px;color:var(--ink-dim);line-height:1.4;}
  .timeline details summary{font-size:12px;font-weight:600;color:var(--floodlight);cursor:pointer;margin:2px 0 6px;}

  .section{margin:10px 0;padding-top:10px;border-top:1px solid var(--line);}
  .section .reserve-link:first-of-type{margin-top:6px;}
  .email-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px;}
  .email-row .email-text{flex:1;color:var(--ink);word-break:break-all;}
  .copy-btn{font-size:12px;font-weight:600;padding:7px 11px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;flex-shrink:0;}
  .copy-btn:hover{border-color:var(--floodlight);color:var(--floodlight);}
  .copy-btn.copied{border-color:var(--libre);color:var(--libre);}
  .reserve-link{
    display:block;text-align:center;margin-top:8px;padding:10px 12px;border-radius:6px;
    background:var(--accent-dark);color:var(--on-accent);text-decoration:none;font-size:12.5px;font-weight:600;
  }
  .reserve-link:hover{background:var(--accent-dark-2);}
  .reserve-link.secondary{background:var(--panel);border:1px solid var(--line);color:var(--ink);}
  .reserve-link.secondary:hover{border-color:var(--floodlight);color:var(--floodlight);}
  .more-link{display:inline-block;margin:10px 0 0;font-size:12.5px;font-weight:600;color:var(--floodlight);text-decoration:none;}
  .more-link:hover{text-decoration:underline;}
  .notes-details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;}
  .notes-details summary{font-family:'Teko',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;}
  .notes-details summary::-webkit-details-marker{display:none;}
  .notes-details summary::after{content:'+';font-family:'IBM Plex Sans',sans-serif;font-size:18px;color:var(--ink-dim);}
  .notes-details[open] summary::after{content:'–';}
  .notes-box{font-size:12px;color:var(--ink-dim);line-height:1.5;margin-top:6px;}

  .btn{font-size:13px;font-weight:600;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;width:100%;}
  .btn:hover{border-color:var(--floodlight);color:var(--floodlight);}
  .btn.primary{background:var(--floodlight);color:#fff;border-color:var(--floodlight);}
  .btn.primary:hover{opacity:.92;color:#fff;}

  /* ---------- Légende (sur la carte) ---------- */
  .scoreboard{
    position:absolute;bottom:16px;left:16px;z-index:5;
    background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent-dark);
    border-radius:var(--radius);padding:9px 12px;display:flex;gap:14px;box-shadow:var(--shadow);
  }
  .sb-item{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);white-space:nowrap;}
  .sb-item b{color:var(--ink);font-weight:500;}

  /* ---------- Panneau de filtres (feuille) ---------- */
  #sheetBackdrop{position:fixed;inset:0;z-index:90;background:rgba(10,20,14,.35);}
  #filterSheet{
    position:fixed;z-index:100;background:var(--panel);display:flex;flex-direction:column;
    box-shadow:0 18px 50px rgba(10,20,14,.28);border:1px solid var(--line);
  }
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .sheet-head h2{font-family:'Teko',sans-serif;font-size:22px;font-weight:600;text-transform:uppercase;margin:0;letter-spacing:.03em;}
  .icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--bg);color:var(--ink);font-size:16px;cursor:pointer;}
  .sheet-body{padding:6px 18px 10px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}
  .filter-group{padding:12px 0;border-bottom:1px solid var(--line);}
  .filter-group:last-child{border-bottom:none;}
  .filter-group h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);margin:0 0 8px;}
  .filter-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .filter-chip{
    font-size:13px;font-weight:600;padding:8px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;
  }
  .filter-chip:hover{border-color:var(--floodlight);}
  .filter-chip.active{background:var(--floodlight);color:#fff;border-color:var(--floodlight);}
  .filter-chip.active .status-dot{box-shadow:0 0 0 2px rgba(255,255,255,.85);}
  .sheet-foot{display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-shrink:0;background:var(--panel);}
  .sheet-foot .btn{width:auto;flex:1;}
  .sheet-foot .btn.ghost{flex:0 0 auto;}

  .maplibregl-ctrl-attrib{font-size:11px;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  /* ---------- Bureau : la feuille de filtres est un panneau flottant ---------- */
  @media (min-width:821px){
    #sheetBackdrop{background:transparent;}
    #filterSheet{
      top:var(--sheet-top,120px);right:22px;width:420px;max-height:calc(100dvh - var(--sheet-top,120px) - 24px);
      border-radius:14px;
    }
  }

  /* ---------- Mobile ---------- */
  @media (max-width:820px){
    header.top{padding:10px 14px;}
    .wordmark h1{font-size:28px;}
    .wordmark span.tag,.top-meta{display:none;}
    .toolbar{padding:8px 12px;gap:8px;}
    .sport-chips{display:none;}
    .mobile-sport-select{
      display:block;flex:1;min-width:0;height:44px;padding:0 12px;border-radius:10px;
      border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:15px;
    }
    .filter-open-btn{height:44px;padding:0 16px;border-radius:10px;}
    .mobile-tabs{display:flex;gap:6px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);flex-shrink:0;}
    .mobile-tabs button{
      flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
      color:var(--ink-dim);font-weight:600;font-size:14px;cursor:pointer;
    }
    .mobile-tabs button.active{background:var(--floodlight);color:#fff;border-color:var(--floodlight);}

    /* La carte reste toujours affichée (jamais display:none) : la liste et la fiche la recouvrent */
    aside.list{display:none;position:absolute;inset:0;width:auto;z-index:30;border-left:none;}
    body[data-view="list"] aside.list,body[data-view="detail"] aside.list{display:flex;}

    .list-head{padding:10px 14px;}
    .list-head h2{font-size:18px;}
    .list-body{padding:8px 10px calc(10px + env(safe-area-inset-bottom));}
    .card{padding:13px 14px;}
    .detail{padding:0 14px calc(18px + env(safe-area-inset-bottom));}
    .reserve-link,.copy-btn{min-height:44px;display:flex;align-items:center;justify-content:center;}

    .scoreboard{
      left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));padding:8px 12px;gap:12px;
      overflow-x:auto;border-left-width:1px;border-radius:10px;
    }
    .maplibregl-ctrl-bottom-right{margin-bottom:46px;}

    #filterSheet{left:0;right:0;bottom:0;max-height:82dvh;border-radius:18px 18px 0 0;border-bottom:none;}
    .filter-chip{padding:10px 14px;}
  }
</style>
</head>
<body data-view="map">
<div class="app">

  <header class="top">
    <div class="wordmark">
      <span class="dot"></span>
      <h1>Stadio</h1>
      <span class="tag">terrains de soccer de Montréal, en direct</span>
    </div>
    <div class="top-meta">mise à jour <b id="clock">--:--</b> · <span id="counter">-- terrains</span></div>
  </header>

  <div id="loadError"></div>

  <div class="toolbar">
    <div class="sport-chips" id="sportChips"></div>
    <select class="mobile-sport-select" id="mobileSportSelect" aria-label="Sport"></select>
    <button class="filter-open-btn" id="openFilters" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      Filtres <span id="filterBadge" class="filter-badge" hidden></span>
    </button>
  </div>

  <div class="mobile-tabs">
    <button id="tabMap" class="active" data-act="tab-map">Carte</button>
    <button id="tabList" data-act="tab-list">Liste</button>
  </div>

  <main class="split">
    <div class="map-wrap">
      <div id="map"></div>
      <div class="scoreboard" id="scoreboard"></div>
    </div>
    <aside class="list" id="sidebar"></aside>
  </main>
</div>

<div id="sheetBackdrop" hidden></div>
<section id="filterSheet" role="dialog" aria-label="Filtres" hidden>
  <div class="sheet-head">
    <h2>Filtres</h2>
    <button class="icon-btn" data-act="close-filters" aria-label="Fermer">✕</button>
  </div>
  <div class="sheet-body" id="filterBody"></div>
  <div class="sheet-foot">
    <button class="btn ghost" data-act="clear-filters">Réinitialiser</button>
    <button class="btn primary" data-act="close-filters" id="filterApply">Voir les terrains</button>
  </div>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* =====================================================================
   CONFIG
   Chaque sport a son dossier à la racine du site : <id>/terrains.csv et <id>/images/
   ===================================================================== */
const SPORTS = [
  {id:'soccer', label:'Soccer', enabled:true},
  {id:'tennis', label:'Tennis', enabled:false},
  {id:'patinoire', label:'Patinoires', enabled:false},
  {id:'piscine', label:'Piscines', enabled:false},
];

const STATUS = {
  libre:     {label:'Libre',   short:'Libre',  color:'#2F9E5C', sort:2},
  occupe:    {label:'Occupé',  short:'Occupé', color:'#D9483A', sort:1},
  ferme:     {label:'Fermé',   short:'Fermé',  color:'#6B7280', sort:0},
};
const STATUS_ORDER = ['libre','occupe','ferme'];
const ACCESS_ORDER = ['Accès libre','Réservation gratuite','Réservation payante'];

const MAP_STYLE_URL = 'https://tiles.openfreemap.org/styles/positron';
const MTL_TZ = 'America/Toronto';

/* =====================================================================
   OUTILS
   ===================================================================== */
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function norm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }
function safeUrl(u){ return /^(https?:|mailto:|tel:)/i.test(u||'') ? u : ''; }
function linkify(text){
  return esc(text).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener" style="color:var(--floodlight);word-break:break-all;">${u}</a>`);
}
function fmtMin(m){ const h=Math.floor(m/60)%24, mm=m%60; return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371, r=x=>x*Math.PI/180, dLat=r(lat2-lat1), dLng=r(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function fmtDist(km){ return km<1 ? `${Math.round(km*1000)} m` : `${km.toFixed(1)} km`; }

/* =====================================================================
   CSV — petit parseur (guillemets, virgules et retours à la ligne dans les champs)
   ===================================================================== */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
  const rows=[]; let row=[], field='', inQ=false;
  const endRow=()=>{ row.push(field); field=''; if(row.length>1 || row[0]!=='') rows.push(row); row=[]; };
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
      else field+=c;
    }else if(c==='"') inQ=true;
    else if(c===',') { row.push(field); field=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; endRow(); }
    else field+=c;
  }
  if(field!=='' || row.length) endRow();
  if(!rows.length) return [];
  const head = rows.shift().map(h=>h.trim());
  return rows.map(r=>{ const o={}; head.forEach((h,i)=>{ o[h]=(r[i]==null?'':r[i]).trim(); }); return o; });
}

/* =====================================================================
   CRÉNEAUX — colonne reserved_slots
   7 champs séparés par des virgules, créneaux séparés par "|" :
     Jours,HeureDébut,HeureFin,DateDébut,DateFin,Statut,Étiquette
   - Jours : vide = tous les jours ; "Lundi" ou "Lun" ; plage "Lun-Ven" ; liste "Lun+Mer"
   - Dates : AAAA-MM-JJ, optionnelles
   - Statut : libre | occupe | ferme
   - Étiquette "Heures d'ouverture" = horaire fixe d'ouverture (fermé en dehors)
   - L'étiquette peut contenir des virgules (tout ce qui suit le 6e champ)
   ===================================================================== */
const DAY_KEYS = ['lun','mar','mer','jeu','ven','sam','dim'];
function dayIdx(tok){ return DAY_KEYS.indexOf(norm(tok).slice(0,3)); }
function parseDays(field){
  const set = new Set(), f = String(field||'').trim();
  if(!f){ for(let i=0;i<7;i++) set.add(i); return set; }
  f.split('+').forEach(part=>{
    const bits = part.split(/[-–]/).map(s=>s.trim()).filter(Boolean);
    if(bits.length===2){
      const a=dayIdx(bits[0]), b=dayIdx(bits[1]);
      if(a<0||b<0) return;
      for(let i=a;;i=(i+1)%7){ set.add(i); if(i===b) break; }
    }else if(bits.length===1){ const a=dayIdx(bits[0]); if(a>=0) set.add(a); }
  });
  return set;
}
function toMin(s){ const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||'').trim()); return m ? (+m[1])*60+(+m[2]) : null; }
const SLOT_STATUS = {libre:'libre', occupe:'occupe', signale:'occupe', ferme:'ferme'};   // « signale » (ancien) = occupé

function parseSlots(raw){
  if(!raw) return [];
  return String(raw).split(/\s*\|\s*/).map(c=>c.trim()).filter(Boolean).map(chunk=>{
    const p = chunk.split(',');
    if(p.length < 7) return null;
    const days = parseDays(p[0]);
    const start = toMin(p[1]);
    let end = toMin(p[2]);
    const status = SLOT_STATUS[norm(p[5])];
    if(!days.size || start==null || end==null || !status) return null;
    if(end===1439) end = 1440;                       // 23:59 = fin de journée
    const iso = /^\d{4}-\d{2}-\d{2}$/;
    return {
      days, start, end, status,
      dateStart: iso.test(p[3].trim()) ? p[3].trim() : null,
      dateEnd:   iso.test(p[4].trim()) ? p[4].trim() : null,
      label: p.slice(6).join(',').trim(),
    };
  }).filter(Boolean);
}

/* =====================================================================
   HEURE DE MONTRÉAL — les horaires sont ceux de Montréal, peu importe
   le fuseau de l'appareil. Tout est calculé localement, aucune requête.
   ===================================================================== */
const MTL_FMT = (()=>{ try{
  return new Intl.DateTimeFormat('en-CA',{timeZone:MTL_TZ,weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
}catch(e){ return null; } })();
const WEEKDAY = {Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
function montrealNow(d){
  d = d || new Date();
  if(MTL_FMT){
    const p={}; MTL_FMT.formatToParts(d).forEach(x=>{ p[x.type]=x.value; });
    return {day:WEEKDAY[p.weekday], min:(+p.hour%24)*60+(+p.minute), date:`${p.year}-${p.month}-${p.day}`, ts:d.getTime()};
  }
  const pad=n=>String(n).padStart(2,'0');
  return {day:(d.getDay()+6)%7, min:d.getHours()*60+d.getMinutes(), date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, ts:d.getTime()};
}

function slotsToday(t, now){
  return t.slots
    .filter(s => s.days.has(now.day) && (!s.dateStart || now.date>=s.dateStart) && (!s.dateEnd || now.date<=s.dateEnd))
    .sort((a,b)=>a.start-b.start || a.end-b.end);
}

/* =====================================================================
   STATUT EN DIRECT — 3 états seulement : Libre, Occupé, Fermé
   (reserved_slots × heure de Montréal, 100 % local, aucune requête)

   1. Terrain EXTÉRIEUR du 1er décembre au 1er avril   → Fermé
   2. Créneau actif (le plus restrictif gagne : fermé > occupé > libre)
        - fermé / occupé                               → tel quel
        - libre ou « Heures d'ouverture »              → Libre
   3. Hors des heures d'ouverture publiées             → Fermé
   4. Rien de contraire publié                         → Libre
   Le mode d'accès (accès libre / réservation gratuite / payante) est
   une information à part : voir t.accessTags.
   ===================================================================== */
const SEV = {ferme:3, occupe:2, libre:1};
const OPENING_RE = /heures?\s+d['’]ouverture/i;
const isOpeningSlot = s => OPENING_RE.test(s.label);
const WINTER_NOTE = 'Fermé — saison hivernale (1er décembre au 1er avril)';

function isWinter(now){ const p = now.date.split('-'); const md = (+p[1])*100 + (+p[2]); return md>=1201 || md<=401; }

function effectiveStatus(t, now){
  now = now || montrealNow();
  if(t.lieu==='Extérieur' && isWinter(now)) return {status:'ferme', note:WINTER_NOTE};
  const active = slotsToday(t, now).filter(s=>s.start<=now.min && now.min<s.end);
  if(active.length){
    const s = active.reduce((a,b)=>SEV[b.status]>SEV[a.status]?b:a);
    const until = s.end<1440 ? ` jusqu'à ${fmtMin(s.end)}` : '';
    if(s.status==='ferme') return {status:'ferme', note:s.label||'Fermé'};
    if(s.status==='occupe') return {status:'occupe', note:`${s.label}${until}`};
    return {status:'libre', note: isOpeningSlot(s) ? `Ouvert${until}` : `${s.label}${until}`};
  }
  if(t.hasHours) return {status:'ferme', note:"Fermé — hors des heures d'ouverture"};
  return {status:'libre', note:'Aucune restriction publiée'};
}

/* =====================================================================
   DONNÉES
   ===================================================================== */
let TERRAINS = [];
let statusCache = new Map();
const byId = id => TERRAINS.find(t=>t.id===id);
const getEff = t => statusCache.get(t.id) || effectiveStatus(t);

function resolvePhoto(sport, p){
  if(!p) return '';
  p = String(p).trim();
  if(/^(https?:)?\/\//.test(p) || p.includes('/')) return p;
  return sport + '/images/' + p;
}
const cleanText = v => (/^(na|n\/a|nan|null|-)$/i.test(String(v||'').trim()) ? '' : String(v||'').trim());
const FORMAT_RANK = f => parseInt(f,10) || 0;

async function loadTerrains(){
  const err = $('loadError');
  try{
    const out = [];
    for(const s of SPORTS.filter(x=>x.enabled)){
      const res = await fetch(`${s.id}/terrains.csv?t=${Date.now()}`);
      if(!res.ok) throw new Error(`${s.id}/terrains.csv introuvable (${res.status})`);
      parseCSV(await res.text()).forEach(r=>{ r.__sport=s.id; out.push(r); });
    }
    TERRAINS = out.filter(r=>r.id).map(r=>{
      const sport = r.sport || r.__sport;
      const t = {
        id:r.id, name:r.name||r.id, addr:cleanText(r.addr), lat:parseFloat(r.lat), lng:parseFloat(r.lng), sport,
        format:cleanText(r.format), capacity:Number(r.capacity)||0,
        surface:cleanText(r.surface), lieu:cleanText(r.interieur_exterieur), access:cleanText(r.access),
        reserveUrl:safeUrl(r.reserveUrl), montrealUrl:safeUrl(r.montrealUrl), calendarUrl:safeUrl(r.calendar_url),
        photoUrl:resolvePhoto(sport, r.photo_url),
        slots:parseSlots(r.reserved_slots), notes:cleanText(r.notes),
      };
      t.hasCoords = isFinite(t.lat) && isFinite(t.lng);
      t.hasHours = t.slots.some(isOpeningSlot);
      // Modes d'accès (un terrain peut en avoir plusieurs), dérivés des colonnes :
      //  - access = « Accès libre »        → Accès libre ; + Réservation gratuite si reserveUrl ou calendar_url
      //  - access = « Réservation payante » → Réservation payante ; + Accès libre si créneaux de jeu libre publiés
      const a = norm(t.access), tags = [];
      const freeSlots = t.slots.some(s=>s.status==='libre' && !isOpeningSlot(s));
      if(/payante/.test(a)) tags.push('Réservation payante');
      if(/libre/.test(a) || freeSlots) tags.push('Accès libre');
      if(/libre/.test(a) && (t.reserveUrl || t.calendarUrl)) tags.push('Réservation gratuite');
      t.accessTags = ACCESS_ORDER.filter(x=>tags.includes(x));
      t.formatTags = t.format.split(',').map(s=>s.trim()).filter(Boolean);
      return t;
    });
    err.style.display = 'none';
    return true;
  }catch(e){
    console.error('Échec du chargement des terrains :', e);
    if(!TERRAINS.length){
      err.style.display = 'block';
      err.textContent = "Le fichier des terrains n'a pas pu être chargé — vérifie qu'il est dans soccer/terrains.csv (à côté de index.html).";
    }
    return false;
  }
}

let activeSport = 'soccer';
let selectedId = null;
let view = 'map';          // 'map' | 'list' | 'detail'  (n'a d'effet visuel que sur mobile)
let lastTab = 'map';
let userPos = null;
let listScroll = 0;
let lastSig = '', lastDetailSig = '';
const activeFilters = {status:new Set(), lieu:new Set(), format:new Set(), surface:new Set(), access:new Set()};

function setView(v){
  view = v;
  if(v==='map' || v==='list') lastTab = v;
  document.body.dataset.view = v;
  const tab = v==='detail' ? lastTab : v;
  $('tabMap').classList.toggle('active', tab==='map');
  $('tabList').classList.toggle('active', tab==='list');
}

/* =====================================================================
   FILTRES — Statut (en direct), Lieu (intérieur/extérieur), Format, Surface, Accès
   OU à l'intérieur d'une catégorie, ET entre catégories.
   ===================================================================== */
const FILTERS = [
  {key:'status',  label:'Statut',  get:t=>[getEff(t).status], values:()=>STATUS_ORDER, fmt:v=>STATUS[v].short},
  {key:'lieu',    label:'Lieu',    get:t=>t.lieu?[t.lieu]:[],       values:()=>distinct(t=>t.lieu?[t.lieu]:[])},
  {key:'format',  label:'Format',  get:t=>t.formatTags,             values:()=>distinct(t=>t.formatTags).sort((a,b)=>FORMAT_RANK(b)-FORMAT_RANK(a))},
  {key:'surface', label:'Surface', get:t=>t.surface?[t.surface]:[], values:()=>distinct(t=>t.surface?[t.surface]:[])},
  {key:'access',  label:'Accès',   get:t=>t.accessTags,   values:()=>ACCESS_ORDER},
];
function distinct(getter){
  const s = new Set();
  TERRAINS.filter(t=>t.sport===activeSport).forEach(t=>getter(t).forEach(v=>s.add(v)));
  return [...s].sort((a,b)=>a.localeCompare(b,'fr'));
}
function matchesFilters(t){
  return FILTERS.every(f=>{
    const sel = activeFilters[f.key];
    return !sel.size || f.get(t).some(v=>sel.has(v));
  });
}
const activeFilterCount = () => Object.values(activeFilters).reduce((n,s)=>n+s.size,0);

function renderFilterBody(){
  $('filterBody').innerHTML = FILTERS.map(f=>{
    const vals = f.values();
    if(!vals.length) return '';
    return `<div class="filter-group"><h3>${f.label}</h3><div class="filter-chips">${
      vals.map(v=>{
        const on = activeFilters[f.key].has(v);
        const dot = f.key==='status' ? `<span class="status-dot s-${v}"></span>` : '';
        return `<button class="filter-chip ${on?'active':''}" data-act="toggle-filter" data-key="${f.key}" data-val="${esc(v)}">${dot}${esc(f.fmt?f.fmt(v):v)}</button>`;
      }).join('')
    }</div></div>`;
  }).join('');
}
function openFilters(){
  renderFilterBody();
  const btn = $('openFilters').getBoundingClientRect();
  document.documentElement.style.setProperty('--sheet-top', Math.round(btn.bottom+8)+'px');
  $('sheetBackdrop').hidden = false; $('filterSheet').hidden = false;
  updateFilterUI();
}
function closeFilters(){ $('sheetBackdrop').hidden = true; $('filterSheet').hidden = true; }
function updateFilterUI(list){
  const n = activeFilterCount();
  const b = $('filterBadge'); b.textContent = n; b.hidden = !n;
  list = list || currentList();
  $('filterApply').textContent = `Voir ${list.length} terrain${list.length>1?'s':''}`;
}
function clearFilters(){
  Object.values(activeFilters).forEach(s=>s.clear());
  if(!$('filterSheet').hidden) renderFilterBody();
  refresh({fit:true, force:true});
}

/* =====================================================================
   LISTE ET FICHE (panneau latéral ; recouvre la carte sur mobile)
   ===================================================================== */
function currentList(){
  let list = TERRAINS.filter(t=>t.sport===activeSport && t.hasCoords && matchesFilters(t));
  if(userPos){
    const d = new Map(list.map(t=>[t.id, haversineKm(userPos.lat,userPos.lng,t.lat,t.lng)]));
    list = list.slice().sort((a,b)=>d.get(a.id)-d.get(b.id));
    list.dist = d;
  }else{
    list = list.slice().sort((a,b)=>STATUS[getEff(b).status].sort-STATUS[getEff(a).status].sort);
  }
  return list;
}

function renderSidebarList(){
  const sport = SPORTS.find(s=>s.id===activeSport);
  $('sidebar').innerHTML = `
    <div class="list-head">
      <h2>Terrains — ${esc(sport.label)}</h2>
      <p id="listMeta"></p>
    </div>
    <div class="list-body" id="listBody"></div>`;
  renderListBody(currentList());
}

function renderListBody(list){
  const body = $('listBody');
  if(!body) return;
  const n = activeFilterCount();
  $('listMeta').innerHTML = `${list.length} terrain${list.length>1?'s':''}${n?` · ${n} filtre${n>1?'s':''} actif${n>1?'s':''} <button class="link-btn" data-act="clear-filters">Réinitialiser</button>`:''}`;
  if(!list.length){
    body.innerHTML = `<div class="empty-state">Aucun terrain ne correspond à ces filtres.${n?'<button class="btn" data-act="clear-filters">Réinitialiser les filtres</button>':''}</div>`;
    return;
  }
  const top = body.scrollTop;
  body.innerHTML = list.map(t=>{
    const e = getEff(t);
    const d = list.dist ? list.dist.get(t.id) : null;
    return `<div class="card" role="button" tabindex="0" data-id="${esc(t.id)}">
      <div class="card-top">
        <div class="card-name">${esc(t.name)}</div>
        <div class="status-pill s-${e.status}"><span class="status-dot"></span>${esc(STATUS[e.status].short)}</div>
      </div>
      <div class="card-meta"><span>${esc(t.addr)}</span>${d!=null?`<span>${fmtDist(d)}</span>`:''}</div>
    </div>`;
  }).join('');
  body.scrollTop = top;
}

function renderTimeline(t){
  if(!t.slots.length) return '';
  const now = montrealNow();
  const rows = slotsToday(t, now);
  const row = s => {
    const allDay = s.start===0 && s.end>=1440;
    const live = now.min>=s.start && now.min<s.end;
    return `<div class="timeline-row s-${s.status} ${live?'now':''}">
      <span class="status-dot"></span>
      <span class="hrs">${allDay?'Toute la journée':`${fmtMin(s.start)}–${fmtMin(s.end)}`}</span>${esc(s.label||STATUS[s.status].short)}
    </div>`;
  };
  const body = !rows.length ? `<div class="timeline-empty">Aucun créneau publié aujourd'hui.</div>`
    : rows.slice(0,4).map(row).join('') + (rows.length>4 ? `<details><summary>+ ${rows.length-4} autre${rows.length>5?'s':''}</summary>${rows.slice(4).map(row).join('')}</details>` : '');
  return `<div class="timeline"><h3>Horaires du jour</h3>${body}</div>`;
}

function calendarLabel(u){
  if(/calendar|agenda/i.test(u)) return 'Voir le calendrier';
  if(/etat|état/i.test(u)) return "Voir l'état des terrains";
  return "Site de l'installation";
}
function renderReservation(t){
  const parts = [];
  if(t.calendarUrl) parts.push(`<a class="reserve-link" href="${esc(t.calendarUrl)}" target="_blank" rel="noopener">${calendarLabel(t.calendarUrl)} ↗</a>`);
  if(t.reserveUrl.startsWith('mailto:')){
    const email = t.reserveUrl.slice(7);
    parts.push(`<div class="email-row"><span class="email-text">${esc(email)}</span><button class="copy-btn" data-act="copy" data-copy="${esc(email)}">Copier</button></div>`);
  }else if(t.reserveUrl.startsWith('tel:')){
    const phone = t.reserveUrl.replace(/^tel:\+?1?/,'').replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3');
    parts.push(`<a class="reserve-link" href="${esc(t.reserveUrl)}">Appeler — ${esc(phone)}</a>`);
  }else if(t.reserveUrl){
    parts.push(`<a class="reserve-link" href="${esc(t.reserveUrl)}" target="_blank" rel="noopener">Réserver / infos ↗</a>`);
  }
  const official = t.montrealUrl && t.montrealUrl!==t.calendarUrl && t.montrealUrl!==t.reserveUrl
    ? `<a class="more-link" href="${esc(t.montrealUrl)}" target="_blank" rel="noopener">Fiche officielle ↗</a>` : '';
  if(!parts.length && !official) return '';
  return `<div class="section">${parts.length?`<h3>Réserver</h3>${parts.join('')}`:''}${official?`<div>${official}</div>`:''}</div>`;
}

function renderNotes(t){
  if(!t.notes) return '';
  return `<details class="notes-details"><summary>Détails</summary><div class="notes-box">${linkify(t.notes)}</div></details>`;
}

function openDetail(id, opts={}){
  const t = byId(id);
  if(!t) return;
  if(!opts.silent){
    if(view!=='detail') listScroll = ($('listBody')||{}).scrollTop || 0;
    selectedId = id;
    setView('detail');
  }
  const e = getEff(t);
  lastDetailSig = e.status+'|'+e.note;
  const tags = [];
  if(t.lieu) tags.push(`<span class="tag lieu">${esc(t.lieu)}</span>`);
  t.formatTags.forEach(f=>tags.push(`<span class="tag">${esc(f)}</span>`));
  if(t.surface) tags.push(`<span class="tag">${esc(t.surface)}</span>`);
  t.accessTags.forEach(a=>tags.push(`<span class="tag">${esc(a)}</span>`));

  const prev = $('sidebar').querySelector('.detail');
  const top = prev ? prev.scrollTop : 0;
  $('sidebar').innerHTML = `
    <div class="detail">
      <div class="detail-bar"><button class="back-btn" data-act="back">← Retour</button></div>
      ${t.photoUrl?`<img class="detail-img" src="${esc(t.photoUrl)}" alt="${esc(t.name)}" onerror="this.remove()">`:''}
      <div class="detail-name">${esc(t.name)}</div>
      <div class="detail-status s-${e.status}">
        <span class="status-dot"></span>
        <div>${esc(STATUS[e.status].label)}${e.note?`<small>${esc(e.note)}</small>`:''}</div>
      </div>
      ${tags.length?`<div class="tag-row">${tags.join('')}</div>`:''}
      ${renderTimeline(t)}
      ${renderReservation(t)}
      ${renderNotes(t)}
    </div>`;
  if(opts.silent && prev) $('sidebar').querySelector('.detail').scrollTop = top;
  applySelection();
}

function showList(){
  selectedId = null;
  lastDetailSig = '';
  applySelection();
  renderSidebarList();
  $('listBody').scrollTop = listScroll;
  setView(lastTab==='list' ? 'list' : 'map');
}

function selectTerrain(id, fromMap){
  openDetail(id);
  const t = byId(id);
  if(!t || fromMap || !mapReady) return;
  map.easeTo({center:[t.lng,t.lat], zoom:Math.max(map.getZoom(),15), duration:600});
}

function renderLegend(list){
  const c = {}; STATUS_ORDER.forEach(k=>c[k]=0);
  list.forEach(t=>c[getEff(t).status]++);
  $('scoreboard').innerHTML = STATUS_ORDER.map(k=>
    `<div class="sb-item s-${k}"><span class="sb-dot"></span>${esc(STATUS[k].short)} <b>${c[k]}</b></div>`).join('');
}

/* =====================================================================
   CARTE — MapLibre GL (rendu vectoriel), style OpenFreeMap « positron »
   recoloré pour se rapprocher de la carte de base de Google Maps.
   Les pins sont une couche GPU (GeoJSON + clustering natif) : fluide
   même avec des centaines de terrains, aucun marqueur DOM.
   ===================================================================== */
const LOOK = {
  land:'#f6f6f4', water:'#92d9ee', park:'#cdeed6', commercial:'#f1eee6', building:'#eceae6',
  roadMinorFar:'#dde2ec', roadMinorNear:'#ffffff', roadMinorCase:'#cdd3e0',
  roadArterial:'#c4cce2', roadArterialCase:'#aeb8d3',
  roadHighway:'#a3b0d6', roadHighwayCase:'#8996c4',
  text:'#3c4043',
};
const PARK_RE = /park|grass|wood|forest|garden|pitch|cemetery|golf|recreation|nature|meadow|scrub|wetland|stadium|playground|sports|village_green|farmland/;

function googleLook(style){
  const set = (L,prop,val)=>{ L.paint = L.paint||{}; L.paint[prop]=val; };
  (style.layers||[]).forEach(L=>{
    try{
      const id = String(L.id||'').toLowerCase(), sl = L['source-layer'];
      const txt = id+' '+JSON.stringify(L.filter||'').toLowerCase();
      if(L.type==='background'){ set(L,'background-color',LOOK.land); }
      else if(L.type==='fill'){
        if(sl==='water') set(L,'fill-color',LOOK.water);
        else if(sl==='building') set(L,'fill-color',LOOK.building);
        else if((sl==='park'||sl==='landcover'||sl==='landuse') && PARK_RE.test(txt)){ set(L,'fill-color',LOOK.park); set(L,'fill-opacity',1); }
        else if(sl==='landuse' && /commercial|industrial|retail/.test(txt)) set(L,'fill-color',LOOK.commercial);
        else if(sl==='landuse' && /residential/.test(txt)) set(L,'fill-color',LOOK.land);
      }else if(L.type==='line'){
        if(sl==='waterway') set(L,'line-color',LOOK.water);
        else if(sl==='transportation' && !/rail|ferry|aerial|path|pedestrian|track|footway|steps/.test(id)){
          const casing = /casing/.test(id);
          if(/motorway|trunk/.test(id))       set(L,'line-color',casing?LOOK.roadHighwayCase:LOOK.roadHighway);
          else if(/major|primary|secondary|tertiary/.test(id)) set(L,'line-color',casing?LOOK.roadArterialCase:LOOK.roadArterial);
          else if(casing)                     set(L,'line-color',LOOK.roadMinorCase);
          else set(L,'line-color',['interpolate',['linear'],['zoom'],12,LOOK.roadMinorFar,15,LOOK.roadMinorNear]);
        }
      }else if(L.type==='symbol' && L.layout && L.layout['text-field']){
        set(L,'text-color',LOOK.text); set(L,'text-halo-color','#ffffff'); set(L,'text-halo-width',1.4);
      }
    }catch(e){ /* un calque inattendu ne doit jamais casser la carte */ }
  });
  return style;
}
function pickFont(style){
  const bad = ['literal','get','case','match','step','interpolate','coalesce'];
  for(const L of (style.layers||[])){
    let f = L.layout && L.layout['text-font'];
    if(Array.isArray(f) && f[0]==='literal') f = f[1];
    if(Array.isArray(f) && f.length && f.every(x=>typeof x==='string') && !bad.includes(f[0])) return f;
  }
  return ['Noto Sans Regular'];
}
const FALLBACK_STYLE = {
  version:8, glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
  sources:{}, layers:[{id:'bg',type:'background',paint:{'background-color':'#e9ece4'}}],
};

// Pin « goutte » dessiné en canvas, une image par statut
function makePinImage(color){
  const W=44, H=58, c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  x.beginPath();
  x.arc(22,21,17,Math.PI*0.80,Math.PI*0.20,false);
  x.lineTo(22,H-3);
  x.closePath();
  x.fillStyle=color; x.fill();
  x.lineWidth=2.5; x.strokeStyle='rgba(0,0,0,.28)'; x.stroke();
  x.beginPath(); x.arc(22,21,7.5,0,Math.PI*2); x.fillStyle='#fff'; x.fill();
  return x.getImageData(0,0,W,H);
}

let map = null, mapReady = false, pendingFC = null, pendingFit = null, mapFont = ['Noto Sans Regular'];

async function initMap(){
  if(typeof maplibregl === 'undefined'){
    const err = $('loadError'); err.style.display='block';
    err.textContent = "La carte n'a pas pu être chargée (bibliothèque MapLibre bloquée). La liste reste disponible.";
    return;
  }
  let style = FALLBACK_STYLE;
  try{
    const r = await fetch(MAP_STYLE_URL);
    if(!r.ok) throw new Error('style '+r.status);
    style = googleLook(await r.json());
  }catch(e){ console.warn('Style de carte indisponible, fond neutre utilisé :', e); }
  mapFont = pickFont(style);

  map = new maplibregl.Map({
    container:'map', style, center:[-73.62,45.53], zoom:10.5, maxZoom:19,
    attributionControl:false, dragRotate:false, pitchWithRotate:false,
  });
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.AttributionControl({compact:true}), 'bottom-right');
  map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-right');
  const geo = new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true}, trackUserLocation:false, showUserLocation:true});
  geo.on('geolocate', ev=>{ userPos={lat:ev.coords.latitude, lng:ev.coords.longitude}; refresh({force:true}); });
  map.addControl(geo, 'top-right');

  map.on('error', e=>console.warn('Carte :', e && e.error ? e.error.message : e));
  map.on('load', onMapLoad);
}

function onMapLoad(){
  STATUS_ORDER.forEach(k=>{
    map.addImage('pin-'+k, makePinImage(STATUS[k].color), {pixelRatio:2});
  });
  map.addSource('terrains', {type:'geojson', data:pendingFC||{type:'FeatureCollection',features:[]}, cluster:true, clusterRadius:46, clusterMaxZoom:14});

  map.addLayer({id:'clusters', type:'circle', source:'terrains', filter:['has','point_count'], paint:{
    'circle-color':'#122A1C',
    'circle-radius':['step',['get','point_count'],16,10,19,50,23,150,27],
    'circle-stroke-width':3, 'circle-stroke-color':'rgba(255,255,255,.88)',
  }});
  map.addLayer({id:'cluster-count', type:'symbol', source:'terrains', filter:['has','point_count'],
    layout:{'text-field':['get','point_count_abbreviated'], 'text-font':mapFont, 'text-size':13, 'text-allow-overlap':true},
    paint:{'text-color':'#ffffff'}});
  const pinLayout = {'icon-image':['concat','pin-',['get','status']], 'icon-anchor':'bottom', 'icon-allow-overlap':true, 'icon-ignore-placement':true};
  map.addLayer({id:'pins', type:'symbol', source:'terrains', filter:['!',['has','point_count']],
    layout:{...pinLayout, 'symbol-sort-key':['get','sort']}});
  map.addLayer({id:'pin-selected', type:'symbol', source:'terrains',
    filter:['all',['!',['has','point_count']],['==',['get','id'],'__none__']],
    layout:{...pinLayout, 'icon-size':1.4}});

  map.on('click','clusters', ev=>{
    const f = map.queryRenderedFeatures(ev.point,{layers:['clusters']})[0];
    if(!f) return;
    map.getSource('terrains').getClusterExpansionZoom(f.properties.cluster_id).then(z=>{
      map.easeTo({center:f.geometry.coordinates, zoom:Math.min(z+0.5, 18)});
    });
  });
  const onPin = ev=>{ const f = ev.features && ev.features[0]; if(f) selectTerrain(f.properties.id, true); };
  map.on('click','pins', onPin);
  map.on('click','pin-selected', onPin);
  ['clusters','pins','pin-selected'].forEach(l=>{
    map.on('mouseenter',l,()=>{ map.getCanvas().style.cursor='pointer'; });
    map.on('mouseleave',l,()=>{ map.getCanvas().style.cursor=''; });
  });

  mapReady = true;
  applySelection();
  if(pendingFit) fitToList(pendingFit);
}

function setMapData(list){
  const fc = {type:'FeatureCollection', features:list.map(t=>({
    type:'Feature', geometry:{type:'Point', coordinates:[t.lng,t.lat]},
    properties:{id:t.id, status:getEff(t).status, sort:STATUS[getEff(t).status].sort},
  }))};
  if(mapReady) map.getSource('terrains').setData(fc); else pendingFC = fc;
}
function applySelection(){
  if(!mapReady) return;
  map.setFilter('pin-selected', ['all',['!',['has','point_count']],['==',['get','id'], selectedId||'__none__']]);
}
function fitToList(list){
  if(!list.length) return;
  if(!mapReady){ pendingFit = list; return; }
  pendingFit = null;
  if(list.length===1){ map.easeTo({center:[list[0].lng,list[0].lat], zoom:15}); return; }
  const b = new maplibregl.LngLatBounds();
  list.forEach(t=>b.extend([t.lng,t.lat]));
  map.fitBounds(b, {padding:{top:50,bottom:80,left:50,right:50}, maxZoom:14, duration:500});
}

/* =====================================================================
   BOUCLE PRINCIPALE
   ===================================================================== */
function refresh(opts={}){
  const now = montrealNow();
  statusCache = new Map(TERRAINS.map(t=>[t.id, effectiveStatus(t, now)]));
  const list = currentList();
  $('counter').textContent = `${list.length} terrain${list.length>1?'s':''}`;
  $('clock').textContent = new Date().toLocaleTimeString('fr-CA',{timeZone:MTL_TZ,hour:'2-digit',minute:'2-digit'});
  renderLegend(list);
  updateFilterUI(list);

  const sig = list.map(t=>t.id+':'+getEff(t).status).join('|');
  if(sig!==lastSig || opts.force){
    lastSig = sig;
    setMapData(list);
    if(!selectedId) renderListBody(list);
  }
  if(opts.fit) fitToList(list);

  if(selectedId){
    const t = byId(selectedId);
    if(t){ const e=getEff(t); if(e.status+'|'+e.note!==lastDetailSig) openDetail(selectedId,{silent:true}); }
  }
}

function requestGeolocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      p=>{ userPos={lat:p.coords.latitude, lng:p.coords.longitude}; resolve(userPos); },
      ()=>resolve(null),
      {enableHighAccuracy:false, timeout:8000, maximumAge:5*60*1000}
    );
  });
}

/* =====================================================================
   INTERFACE : sports, clics (délégation d'événements), clavier
   ===================================================================== */
function renderSportUI(){
  $('sportChips').innerHTML = SPORTS.map(s=>
    `<div class="chip ${s.id===activeSport?'active':''} ${!s.enabled?'disabled':''}" ${s.enabled?`data-act="sport" data-sport="${s.id}"`:''}>${esc(s.label)}${!s.enabled?' · bientôt':''}</div>`).join('');
  $('mobileSportSelect').innerHTML = SPORTS.map(s=>
    `<option value="${s.id}" ${s.id===activeSport?'selected':''} ${!s.enabled?'disabled':''}>${esc(s.label)}${!s.enabled?' (bientôt)':''}</option>`).join('');
}
function setSport(id){
  activeSport = id;
  Object.values(activeFilters).forEach(s=>s.clear());
  renderSportUI();
  showList();
  refresh({fit:true, force:true});
}

async function copyText(text, btn){
  const done = ()=>{ btn.textContent='Copié'; btn.classList.add('copied'); setTimeout(()=>{ btn.textContent='Copier'; btn.classList.remove('copied'); },1800); };
  try{ await navigator.clipboard.writeText(text); done(); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(_){}
    ta.remove();
  }
}

document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-act],.card[data-id]');
  if(!el) return;
  if(el.classList.contains('card') && !el.dataset.act){ selectTerrain(el.dataset.id, false); return; }
  switch(el.dataset.act){
    case 'back':        showList(); break;
    case 'tab-map':     selectedId=null; applySelection(); setView('map'); break;
    case 'tab-list':    selectedId=null; applySelection(); renderSidebarList(); setView('list'); break;
    case 'sport':       setSport(el.dataset.sport); break;
    case 'copy':        copyText(el.dataset.copy, el); break;
    case 'toggle-filter':{
      const set = activeFilters[el.dataset.key], v = el.dataset.val;
      if(set.has(v)) set.delete(v); else set.add(v);
      el.classList.toggle('active', set.has(v));
      refresh({fit:true, force:true}); break; }
    case 'clear-filters': clearFilters(); break;
    case 'close-filters': closeFilters(); break;
  }
});
document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape' && !$('filterSheet').hidden) closeFilters();
  if((ev.key==='Enter'||ev.key===' ') && ev.target.classList && ev.target.classList.contains('card')){ ev.preventDefault(); selectTerrain(ev.target.dataset.id,false); }
});
$('sheetBackdrop').addEventListener('click', closeFilters);
$('openFilters').addEventListener('click', ()=> $('filterSheet').hidden ? openFilters() : closeFilters());
$('mobileSportSelect').addEventListener('change', e=>setSport(e.target.value));

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
(async function start(){
  renderSportUI();
  renderSidebarList();
  setView('map');
  const mapInit = initMap();
  await loadTerrains();
  refresh({fit:true, force:true});
  mapInit.catch(()=>{});
  requestGeolocation().then(p=>{ if(p) refresh({force:true}); });
})();
setInterval(()=>refresh(), 30000);                       // le statut dépend de l'heure : recalcul local, sans requête
setInterval(async()=>{ if(await loadTerrains()) refresh({force:true}); }, 5*60*1000);
</script>
